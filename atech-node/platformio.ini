; One codebase, two boards. Flash with: pio run -e node1 -t upload
[env]
platform = espressif32
framework = arduino
board = esp32dev          ; change to match the Atech board
monitor_speed = 115200
lib_deps =
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7

[env:node1]
build_flags = -DNODE_ID=1

[env:node2]
build_flags = -DNODE_ID=2
