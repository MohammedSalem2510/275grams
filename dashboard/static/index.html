<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chirp</title>
  <script src="/appearance.js"></script>
  <link rel="stylesheet" href="/appearance.css">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      grid-template-rows: 1fr auto;
      background: #f3f5f0;
      color: #213b30;
      font-family: "IBM Plex Sans", system-ui, sans-serif;
    }
    main { align-self: center; padding: 48px 20px; text-align: center; }
    main img { display: block; margin: 0 auto 8px; }
    h1 {
      margin: 0;
      font-size: clamp(4rem, 10vw, 7rem);
      line-height: 1;
      letter-spacing: -.065em;
      font-weight: 600;
    }
    main p { margin: 12px 0 24px; color: #465f51; font-size: 1rem; line-height: 1.5; }
    nav { display: flex; justify-content: center; flex-wrap: wrap; gap: 10px; }
    nav a {
      display: grid;
      place-items: center;
      min-width: 116px;
      min-height: 46px;
      padding: 10px 18px;
      border: 1px solid #96a89d;
      border-radius: 24px;
      color: inherit;
      font-weight: 550;
      text-decoration: none;
    }
    nav a:first-child { color: white; background: #284e3e; border-color: #284e3e; }
    nav a:hover { background: #e0e8de; }
    nav a:first-child:hover { background: #193e2e; }
    nav a:focus-visible { outline: 2px solid #284e3e; outline-offset: 4px; }
    footer {
      position: relative;
      padding: 22px 20px;
      border-top: 1px solid #d7e0d5;
      background: #eaf0e8;
      text-align: center;
      color: #405949;
    }
    .duck-track {
      position: absolute;
      left: 0;
      right: 0;
      bottom: calc(100% - 4px);
      height: 50px;
      overflow: hidden;
      pointer-events: none;
    }
    .duck-family {
      position: absolute;
      bottom: 4px;
      right: 8%;
      display: block;
      width: 156px;
      height: 42px;
    }
    .footprint {
      position: absolute;
      width: 6px;
      height: 4px;
      background: #806e50;
      clip-path: polygon(0 0, 45% 25%, 65% 0, 70% 35%, 100% 45%, 55% 100%, 25% 75%);
      animation: fade-print 2s ease-out forwards;
    }
    @keyframes fade-print {
      from { opacity: .55; }
      to { opacity: 0; }
    }
    @media (max-width: 520px), (max-height: 500px) {
      .duck-family { width: 104px; height: 28px; }
    }
    footer p {
      margin: 0;
      font: 400 1rem/1.5 Georgia, "Times New Roman", serif;
    }
  </style>
</head>
<body class="landing">
  <canvas class="night-sky" aria-hidden="true"></canvas>
  <canvas class="sky-flight" aria-hidden="true"></canvas>
  <button class="appearance-toggle" type="button" aria-pressed="false">Dark mode</button>
  <main>
    <img src="/favicon.svg" width="32" height="32" alt="">
    <h1>Chirp</h1>
    <p>When did you last stop and listen?</p>
    <nav aria-label="Dashboard">
      <a href="/map.html">Explore</a>
      <a href="/statistics.html">Statistics</a>
    </nav>
  </main>
  <footer>
    <div class="duck-track" aria-hidden="true">
      <img class="duck-family" src="/duck-family.svg" width="156" height="42" alt="">
    </div>
    <p>We built Chirp to hear which birds share our neighbourhoods and notice when their calls grow quiet.</p>
  </footer>
  <script src="/duck-walk.js"></script>
  <script src="/night-sky.js"></script>
</body>
</html>
