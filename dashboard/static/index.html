<!doctype html>
<html lang="en" data-theme="forest">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chirp — Bird activity map</title>
<link rel="stylesheet" href="style.css">
<body>
<header><a href="./" aria-label="Chirp home"><span>◉</span> chirp</a><label>Theme <select id="theme"><option value="forest">Forest</option><option value="paper">Linen</option><option value="ocean">Tide</option><option value="night">After dark</option></select></label></header>
<main>
<p class="eyebrow">CHIRP FIELD ATLAS</p>
<h1>Explore bird activity</h1>
<p class="intro">Choose a bird and tap a station to see where it was detected.</p>
<section class="atlas" aria-label="Bird activity map">
<div class="toolbar"><label>Bird species <select id="species"></select></label><label>Period <select id="period"><option value="24">Last 24 hours</option><option value="168">Last 7 days</option><option value="">All time</option></select></label><label class="toggle"><input id="heat" type="checkbox" checked> Heatmap</label></div>
<div class="map">
<div id="sample"><div id="sample-points"></div></div>
<div id="google-map" hidden></div>
<span id="map-status" role="status">Station positions</span>
</div>
<div class="legend"><span>Detections per listening hour</span><span class="scale">0 <i></i> 24+</span><span>◯ Rate unavailable</span></div>
</section>
<section class="station" aria-label="Selected station"><div><p class="eyebrow">SELECTED STATION</p><h2 id="station-name"></h2><p id="station-info"></p></div><div><strong id="rate"></strong></div></section>
<p id="connection" role="status">Connecting to Chirp…</p><section class="station"><div><h2>Recent detections</h2><ul id="detections"></ul></div></section><p class="note">Areas between stations are unsampled.</p>
</main>
<script src="maps-config.js"></script><script src="app.js"></script><script src="alerts.js"></script>
</body>
</html>
