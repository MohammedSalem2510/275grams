<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 52 14" shape-rendering="crispEdges">
  <defs>
    <style>
      .stride-b { opacity: 0; }
      @media (prefers-reduced-motion: no-preference) {
        .stride-a, .stride-b { animation: tread .9s steps(1, end) infinite; }
        .stride-b { animation-delay: -.45s; }
        .last-duckling {
          transform-origin: 43px 13px;
          animation: stumble 10s ease-in-out -7s infinite;
        }
      }
      @keyframes tread {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      @keyframes stumble {
        0%, 90%, 100% { transform: none; }
        92%, 94% { transform: translateX(1px) rotate(-45deg); }
        97% { transform: translateY(-1px) rotate(8deg); }
      }
    </style>
    <g id="duckling">
      <path fill="#e7ae50" d="M2 0h3v1h1v3h2V3h2v3H9v1H3V6H2V4H1V1h1z"/>
      <path fill="#f6d77b" d="M2 1h3v2H4v1H2zM3 4h5v1H7v1H4V5H3z"/>
      <path fill="#283c37" d="M2 2h1v1H2z"/>
      <path fill="#ce7543" d="M0 3h2v1H0z"/>
    </g>
  </defs>
  <!-- A mallard in profile, looking back along the banner's top edge. -->
  <path fill="#35634f" d="M4 0h4v1h1v1h1v5H8v1H5V7H3V6H2V2h1V1h1z"/>
  <path fill="#63947a" d="M4 1h4v1H4zM3 2h1v2H3z"/>
  <path fill="#203832" d="M4 3h1v1H4z"/>
  <path fill="#e7ad4c" d="M0 5h4v1H0zM1 6h2v1H1z"/>
  <path fill="#f4efd8" d="M4 7h6v1H4z"/>
  <path fill="#996246" d="M4 8h6V7h5v1h3V7h2V6h1v4h-2v1h-2v1H7v-1H5v-1H4z"/>
  <path fill="#b79d76" d="M9 8h6v1h4v1h-3v1H9z"/>
  <path fill="#58658d" d="M10 8h5v1h-1v1h-4z"/>
  <path class="stride-a" fill="#ce7543" d="M8 12h1v2H6v-1h2zM13 12h1v1h2v1h-3z"/>
  <path class="stride-b" fill="#ce7543" d="M8 12h2v1H7v-1zM13 12h1v2h-3v-1h2z"/>
  <use href="#duckling" x="25" y="6"/>
  <path class="stride-a" fill="#ce7543" d="M28 13h2v1h-2zM32 13h1v1h-1z"/>
  <path class="stride-b" fill="#ce7543" d="M29 13h2v1h-2zM31 12h2v1h-2z"/>
  <g class="last-duckling">
    <use href="#duckling" x="41" y="6"/>
    <path class="stride-a" fill="#ce7543" d="M43 13h2v1h-2zM47 13h2v1h-2z"/>
    <path class="stride-b" fill="#ce7543" d="M44 12h2v1h-2zM46 13h2v1h-2z"/>
  </g>
</svg>
